[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[context.production.environment]
  VITE_F100_CALENDAR_URL = "https://calendar.app.google/C7c5rBSzTpBLVaCh9"

[[redirects]]
  from = "/api/intake"
  to = "/.netlify/functions/intake"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
